spring.application.name=learningrag

# --- PostgreSQL / pgvector -------------------------------------------------
spring.datasource.url=${RAG_DB_URL:jdbc:postgresql://localhost:5432/learningrag}
spring.datasource.username=${RAG_DB_USERNAME}
spring.datasource.password=${RAG_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${RAG_DB_POOL_SIZE:10}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- AuthN (M0: single local API key) --------------------------------------
rag.auth.api-key=${RAG_API_KEY:}
rag.auth.principal-id=${RAG_PRINCIPAL_ID:local-user}
rag.auth.tenant-id=${RAG_TENANT_ID:acme}

# --- Retrieval / chunking --------------------------------------------------
rag.retrieval.top-k=${RAG_TOP_K:6}
rag.retrieval.max-question-chars=${RAG_MAX_QUESTION_CHARS:2000}
rag.chunking.max-chars=${RAG_CHUNK_MAX_CHARS:1200}
rag.chunking.overlap-chars=${RAG_CHUNK_OVERLAP_CHARS:200}

# --- Embeddings (DJL / ONNX) -----------------------------------------------
rag.embedding.model-path=${RAG_EMBEDDING_MODEL_PATH:models/paraphrase-multilingual-MiniLM-L12-v2}
rag.embedding.tokenizer-path=${RAG_EMBEDDING_TOKENIZER_PATH:models/paraphrase-multilingual-MiniLM-L12-v2/tokenizer.json}
rag.embedding.dimension=${RAG_EMBEDDING_DIMENSION:384}
rag.embedding.max-sequence-length=${RAG_EMBEDDING_MAX_SEQ:256}
rag.embedding.batch-size=${RAG_EMBEDDING_BATCH_SIZE:8}

# --- DeepSeek --------------------------------------------------------------
deepseek.api-key=${DEEPSEEK_API_KEY}
deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}
deepseek.max-tokens=${DEEPSEEK_MAX_TOKENS:1000}
deepseek.temperature=${DEEPSEEK_TEMPERATURE:0.0}
deepseek.connect-timeout=${DEEPSEEK_CONNECT_TIMEOUT:5s}
deepseek.read-timeout=${DEEPSEEK_READ_TIMEOUT:120s}
deepseek.max-retries=${DEEPSEEK_MAX_RETRIES:2}
deepseek.initial-backoff=${DEEPSEEK_INITIAL_BACKOFF:500ms}
deepseek.daily-token-budget=${DEEPSEEK_DAILY_TOKEN_BUDGET:200000}
deepseek.reserved-tokens-per-call=${DEEPSEEK_RESERVED_TOKENS_PER_CALL:4096}

# --- Output guard ----------------------------------------------------------
rag.output.max-verbatim-chars=${RAG_OUTPUT_MAX_VERBATIM_CHARS:300}

server.port=${RAG_SERVER_PORT:8080}
